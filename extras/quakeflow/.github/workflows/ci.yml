name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check . --output-format=github
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m "not integration" --cov=quakeflow --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quake
          POSTGRES_PASSWORD: quake
          POSTGRES_DB: quakeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quake -d quakeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QF_TEST_DATABASE_URL: postgresql+psycopg2://quake:quake@localhost:5432/quakeflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest -m integration -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quakeflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: docker run --rm quakeflow:ci run --help
