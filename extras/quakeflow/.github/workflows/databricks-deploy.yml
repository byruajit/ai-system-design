name: Databricks bundle

on:
  pull_request:
    paths: ["databricks/**", "src/**", ".github/workflows/databricks-deploy.yml"]
  push:
    branches: [main]
    paths: ["databricks/**", "src/**"]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate (dev target)
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy to dev
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel the job installs
        working-directory: .
        run: |
          pip install build
          python -m build --wheel --outdir databricks/dist
      - uses: databricks/setup-cli@main
      - name: Deploy
        run: databricks bundle deploy -t dev

  deploy-prod:
    name: Deploy to prod
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: prod          # add a required reviewer here for a manual gate
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        working-directory: .
        run: |
          pip install build
          python -m build --wheel --outdir databricks/dist
      - uses: databricks/setup-cli@main
      - name: Deploy
        run: databricks bundle deploy -t prod
